rules:
- http:
    hostnames:
    - source-control.book-workbench.svc.cluster.local
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        credentialUri: ate-secret://k8s.io/default/workbench-secrets/git-token/token
      - header: Actor-Assertion
        actorJwt:
          audiences:
          - source-control.book-workbench.svc.cluster.local
          expirationSeconds: 600
