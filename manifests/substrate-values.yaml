# Published Substrate charts already use the public kagent-dev images.
# scripts/pin-images.sh replaces chart image tags with runtime-lock.json digests.
# This override lets development demo images use the local kind registry.
atelet:
  extraArgs:
  - --localhost-registry-replacement=kind-registry:5000

# The single-user lab must fit alongside Kubernetes on a two-CPU CI runner.
postgres:
  resources:
    requests:
      cpu: 100m
